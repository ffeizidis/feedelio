[project]
name = "feedelio"
version = "0.1.0"
description = "A private, single-user RSS reader built on lemon24/reader"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "reader>=3.26",
    # reader's vendored feedparser imports the top-level `sgmllib` module, which
    # feedparser 6.0.14 stopped pulling in. Drop when reader vendors a newer copy.
    "sgmllib3k>=1",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.52.1",
    "pydantic-settings>=2.7",
    "python-multipart>=0.0.32",
    "defusedxml>=0.7.1",
]

[project.scripts]
feedelio-worker = "feedelio.worker.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.14",
    "ruff>=0.9",
    "httpx>=0.28",
    "pre-commit>=4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/feedelio"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
strict = true

[[tool.mypy.overrides]]
module = ["reader.*", "defusedxml.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --cov=feedelio --cov-report=term-missing --cov-fail-under=90"

[tool.coverage.run]
branch = true
source = ["feedelio"]
