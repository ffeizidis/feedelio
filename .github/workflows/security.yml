name: Security

# CodeQL needs GitHub Advanced Security, which a private repo on this plan does
# not have (see codeql.yml). These checks give the same coverage in spirit —
# dependency advisories and Python SAST — and run on any plan.
on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  dependencies:
    name: Dependency advisories
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Python advisories
        run: |
          uv export --frozen --no-dev --no-emit-project > requirements.txt
          uvx pip-audit -r requirements.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: npm advisories
        run: |
          npm audit --audit-level=high --prefix frontend
          npm audit --audit-level=high --prefix e2e

  sast:
    name: Python static analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7
      - run: uvx bandit -r src -ll
