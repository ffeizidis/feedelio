[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "feedelio"
version = "0.1.0"
description = "A private, keyboard-first desktop feed reader"
requires-python = ">=3.11,<3.14"
dependencies = [
  "reader==3.26", "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sgmllib3k==1.0.0",
  "httpx>=0.28,<1", "beautifulsoup4>=4.13,<5", "trafilatura>=2,<3",
  "nh3>=0.2,<1", "defusedxml>=0.7,<1", "markdownify>=1,<2",
  "rapidfuzz>=3,<4", "regex>=2024.11", "mcp>=1.12,<2",
  "supervisor>=4.2,<5"
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "playwright>=1.50,<2"]

[project.scripts]
feedelio-worker = "feedelio.worker:main"
feedelio-mcp = "feedelio.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["feedelio"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
