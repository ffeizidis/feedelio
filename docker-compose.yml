name: feedelio

x-app: &app
  build: .
  image: feedelio:local
  environment:
    FEEDELIO_DB_PATH: /data/feedelio.sqlite
    FEEDELIO_POLL_INTERVAL: "300"
  volumes:
    - feedelio-data:/data
  restart: unless-stopped

services:
  api:
    <<: *app
    ports:
      - "8000:8000"

  worker:
    <<: *app
    command: ["python", "-m", "feedelio.worker"]
    depends_on:
      - api

volumes:
  feedelio-data:
