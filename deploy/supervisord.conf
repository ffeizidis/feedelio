[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/feedelio-supervisord.pid

[program:api]
command=/app/.venv/bin/uvicorn feedelio.api:app --host 0.0.0.0 --port 8000 --no-access-log
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:worker]
command=/app/.venv/bin/python -m feedelio.worker
directory=/app
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=45
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
