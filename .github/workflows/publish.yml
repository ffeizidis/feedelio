name: Publish

# Every green push to main produces a deployable image.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: publish-main
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    uses: ./.github/workflows/ci.yml

  publish:
    name: Push to GHCR
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha,format=long
            type=raw,value={{date 'YYYYMMDD'}}

      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Artifact attestations are not available for user-owned private repos
      # ("Feature not available…", see run 31795511958). Kept for the day the
      # repo goes public — same treatment as codeql.yml.
      - name: Attest provenance
        if: github.event.repository.visibility == 'public'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Smoke-test the published image
        run: |
          docker run -d --name published -p 8000:8000 \
            ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:8000/api/health; then ok=1; break; fi
            sleep 2
          done
          test "${ok:-0}" = 1 || { docker logs published; exit 1; }
